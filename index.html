<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👓 طلب عدسات من التاجر</title>
    <style>
        :root {
            --bg-color: #0f171e;
            --card-bg: #1a232a;
            --input-bg: #12181f;
            --accent-color: #00e676;
            --accent-active: #00b0ff;
            --text-color: #ffffff;
            --text-secondary: #90a4ae;
            --border-color: #2a3744;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header h2 {
            font-size: 1.2rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
            text-align: center;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* أزرار اختيار نوع العدسة */
        .lens-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag-btn {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* شبكة إدخال الدرجات */
        .degrees-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }

        .degree-input {
            text-align: center;
        }

        .degree-input label {
            font-size: 0.75rem;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* أزرار الإجراءات */
        .add-btn {
            width: 100%;
            background: transparent;
            border: 2px dashed var(--accent-color);
            color: var(--accent-color);
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-color);
            padding: 15px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .send-btn {
            flex: 1;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .copy-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            cursor: pointer;
        }

        .item-summary {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>👓 طلب عدسات</h2>
        <span style="font-size: 0.85rem; color: var(--text-secondary);">طلب جديد</span>
    </div>

    <!-- رقم التاجر -->
    <div class="form-group">
        <label>رقم التاجر (مع رمز الدولة):</label>
        <input type="text" id="merchantPhone" value="9647700000000" placeholder="9647700000000">
    </div>

    <!-- حاوية عناصر الطلب -->
    <div id="itemsContainer">
        <!-- العنصر الأول -->
        <div class="card order-item" id="item-1">
            <!-- عدد العدسات ونوع التصميم -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                <div>
                    <label>نوع العدسة (التصميم)</label>
                    <select class="design-type" onchange="toggleAddSection(this)">
                        <option value="سنجل">سنجل (Single Vision)</option>
                        <option value="باي فوكل">باي فوكل (Bifocal)</option>
                        <option value="بروجريسيف">بروجريسيف (Progressive)</option>
                    </select>
                </div>
                <div>
                    <label>عدد العدسات المطلوب</label>
                    <input type="number" class="quantity" value="2" min="1" onchange="updateTotalCount()">
                </div>
            </div>

            <!-- أزرار اختيار نوع العدسة -->
            <label>خصائص العدسة:</label>
            <div class="lens-tags">
                <button type="button" class="tag-btn active" onclick="selectTag(this, 'بلوكت أزرق')">بلوكت أزرق</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'بلوكت أخضر')">بلوكت أخضر</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'فوتو بلوكات')">فوتو بلوكات</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'ملتيكوتد')">ملتيكوتد</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'فوتو')">فوتو</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'بلاستيك أبيض')">بلاستيك أبيض</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'أخرى')">أخرى</button>
            </div>
            <input type="hidden" class="selected-tag" value="بلوكت أزرق">

            <!-- شبكة إدخال الدرجة -->
            <div class="degrees-grid">
                <div class="degree-input">
                    <label>SPH</label>
                    <input type="text" class="sph" placeholder="-1.00">
                </div>
                <div class="degree-input">
                    <label>CYL</label>
                    <input type="text" class="cyl" placeholder="-0.50">
                </div>
                <!-- الإضافة البصرية تظهر فقط عند اختيار باي فوكل أو بروجريسيف -->
                <div class="degree-input add-field hidden">
                    <label>ADD</label>
                    <input type="text" class="add-val" placeholder="+2.00">
                </div>
            </div>

            <!-- ملاحظة -->
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" class="item-notes" placeholder="مواصفات / ملاحظة لهذه العدسة (اختياري)">
            </div>
        </div>
    </div>

    <button type="button" class="add-btn" onclick="addNewItem()">+ درجة / نظارة جديدة</button>
    <div style="height: 90px;"></div> <!-- مساحة إضافية للأسفل -->
</div>

<!-- الشريط السفلي للعمليات -->
<div class="bottom-bar">
    <div style="width: 100%;">
        <div class="item-summary" id="totalSummary">1 طلب • مجموع العدسات: 2</div>
        <div style="display: flex; gap: 10px;">
            <button class="copy-btn" onclick="copyMessage()">نسخ</button>
            <button class="send-btn" onclick="sendWhatsApp()">إرسال عبر واتساب</button>
        </div>
    </div>
</div>

<script>
    let itemCount = 1;

    // اختيار خصائص العدسة (الأزرار)
    function selectTag(btn, val) {
        const parent = btn.closest('.card');
        parent.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        parent.querySelector('.selected-tag').value = val;
    }

    // إظهار/إخفاء حقل الإضافة البصرية ADD
    function toggleAddSection(selectEl) {
        const parent = selectEl.closest('.card');
        const addField = parent.querySelector('.add-field');
        if (selectEl.value === 'باي فوكل' || selectEl.value === 'بروجريسيف') {
            addField.classList.remove('hidden');
        } else {
            addField.classList.add('hidden');
        }
    }

    // إضافة درجة جديدة
    function addNewItem() {
        itemCount++;
        const container = document.getElementById('itemsContainer');
        const newItem = document.createElement('div');
        newItem.className = 'card order-item';
        newItem.id = `item-${itemCount}`;
        newItem.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="font-weight: bold; font-size: 0.9rem; color: var(--accent-color);">درجة #${itemCount}</span>
                <button onclick="removeItem(this)" style="background:none; border:none; color:#ff5252; cursor:pointer;">حذف</button>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                <div>
                    <label>نوع العدسة</label>
                    <select class="design-type" onchange="toggleAddSection(this)">
                        <option value="سنجل">سنجل (Single Vision)</option>
                        <option value="باي فوكل">باي فوكل (Bifocal)</option>
                        <option value="بروجريسيف">بروجريسيف (Progressive)</option>
                    </select>
                </div>
                <div>
                    <label>عدد العدسات المطلوب</label>
                    <input type="number" class="quantity" value="2" min="1" onchange="updateTotalCount()">
                </div>
            </div>

            <label>خصائص العدسة:</label>
            <div class="lens-tags">
                <button type="button" class="tag-btn active" onclick="selectTag(this, 'بلوكت أزرق')">بلوكت أزرق</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'بلوكت أخضر')">بلوكت أخضر</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'فوتو بلوكات')">فوتو بلوكات</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'ملتيكوتد')">ملتيكوتد</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'فوتو')">فوتو</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'بلاستيك أبيض')">بلاستيك أبيض</button>
                <button type="button" class="tag-btn" onclick="selectTag(this, 'أخرى')">أخرى</button>
            </div>
            <input type="hidden" class="selected-tag" value="بلوكت أزرق">

            <div class="degrees-grid">
                <div class="degree-input">
                    <label>SPH</label>
                    <input type="text" class="sph" placeholder="-1.00">
                </div>
                <div class="degree-input">
                    <label>CYL</label>
                    <input type="text" class="cyl" placeholder="-0.50">
                </div>
                <div class="degree-input add-field hidden">
                    <label>ADD</label>
                    <input type="text" class="add-val" placeholder="+2.00">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" class="item-notes" placeholder="مواصفات / ملاحظة لهذه العدسة (اختياري)">
            </div>
        `;
        container.appendChild(newItem);
        updateTotalCount();
    }

    function removeItem(btn) {
        btn.closest('.card').remove();
        updateTotalCount();
    }

    function updateTotalCount() {
        const items = document.querySelectorAll('.order-item');
        let totalLenses = 0;
        items.forEach(item => {
            const qty = parseInt(item.querySelector('.quantity').value) || 0;
            totalLenses += qty;
        });
        document.getElementById('totalSummary').innerText = `${items.length} طلب • مجموع العدسات: ${totalLenses}`;
    }

    // بناء النص للواتساب
    function buildMessage() {
        const items = document.querySelectorAll('.order-item');
        let text = `📋 *طلب عدسات جديد*\n---------------------------\n`;

        items.forEach((item, index) => {
            const design = item.querySelector('.design-type').value;
            const tag = item.querySelector('.selected-tag').value;
            const qty = item.querySelector('.quantity').value;
            const sph = item.querySelector('.sph').value || '0.00';
            const cyl = item.querySelector('.cyl').value || '0.00';
            const addVal = item.querySelector('.add-val').value;
            const notes = item.querySelector('.item-notes').value;

            text += `🔹 *طلب #${index + 1}:* (${tag} - ${design})\n`;
            text += `• *العدد:* ${qty} عدسة\n`;
            text += `• *الدرجة:* SPH: ${sph} | CYL: ${cyl}`;
            
            if ((design === 'باي فوكل' || design === 'بروجريسيف') && addVal) {
                text += ` | ADD: ${addVal}`;
            }
            text += `\n`;

            if (notes) {
                text += `• *ملاحظة:* ${notes}\n`;
            }
            text += `---------------------------\n`;
        });

        return text;
    }

    function sendWhatsApp() {
        const phone = document.getElementById('merchantPhone').value.trim();
        if (!phone) {
            alert('يرجى كتابة رقم التاجر');
            return;
        }
        const msg = encodeURIComponent(buildMessage());
        window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    function copyMessage() {
        const msg = buildMessage();
        navigator.clipboard.writeText(msg).then(() => {
            alert('تم نسخ الطلب بنجاح!');
        });
    }
</script>

</body>
</html>
